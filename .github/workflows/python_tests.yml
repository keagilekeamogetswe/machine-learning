name: Test workflow

on:
  pull_request:
  push:
    branches:
      - main         

jobs:
  initialise-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database initialisation
        run: python -m scripts.initialise_database

      - name: Run Flyway migrations (SQLite)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            -v ${{ github.workspace }}:/flyway/db \
            flyway/flyway:latest \
            -url="jdbc:sqlite:/flyway/db/machine-learning.db" \
            -driver=org.sqlite.JDBC \
            migrate

      - name: Run Python tests
        run: pytest
